<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}"
>
<head>
    <meta charset="UTF-8">
    <title>Danh sách phiếu nhập</title>
</head>
<body>
<div layout:fragment="content">

    <nav class="navbar bg-primary-custom pb-4 px-0">
        <div class="w-100">
            <form id="formSearch" th:action="@{/manager/goods-receipt/search}" th:object="${criteria}" class="w-100" role="search" method="get">
                <div class="row mb-3">
                    <div class="col-12 d-flex">
                        <input type="search"  class="form-control" th:field="*{keyword}"
                               placeholder="Nhập tên người tạo, nhà cung cấp để tìm kiếm" aria-label="Search"/>
                        <button class="btn btn-primary ms-3 flex-shrink-0 ml-3" type="submit">Search</button>
                    </div>
                </div>
                <div class="row text-left">
                    <div class="col-6 d-flex">
                        <label class="form-label w-25">Từ ngày</label>
                        <input type="date" th:field="*{startDate}" class="form-control w-50">
                    </div>
                    <div class="col-6 d-flex">
                        <label class="form-label w-25">Đến ngày</label>
                        <input type="date" th:field="*{endDate}" on  class="form-control w-50">
                    </div>
                </div>
            </form>
        </div>
    </nav>
    <div class="overflow-auto" style="max-height: 495px;">
        <table class="table table-striped table-bordered " >
            <thead class="thead-light sticky-top">
            <th>Mã phiếu</th>
            <th>Ngày Nhập</th>
            <th>Người nhập</th>
            <th>Nhà cung cấp</th>
            <th>Tổng tiền</th>
            <th style="width: 1%; white-space: nowrap;">Hành động</th>
            </thead>
            <tbody>
            <tr th:each="g : ${goodsReceipt}">
                <td th:text="${g.id}"></td>
                <td th:text="${#temporals.format(g.ngayNhap, 'dd-MM-yyyy')}"></td>
                <td th:text="${g.nguoiNhap.hoTen}"></td>
                <td th:text="${g.nhaCungCap.tenNhaCungCap}"></td>
                <td th:text="${#numbers.formatDecimal(g.tongTien, 0, 'COMMA', 0, 'POINT')}"></td>
                <td style="width: 1%; white-space: nowrap;">
                    <a th:href="@{|/manager/goods-receipt/detail/${g.id}|}"
                       class="btn btn-success btn-sm">
                        <i class="fa fa-eye" aria-hidden="true"></i>
                        <i>Xem chi tiết</i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
<th:block layout:fragment="script">
    <script th:src="@{/js/search.js}"></script>
</th:block>
</body>
</html>
