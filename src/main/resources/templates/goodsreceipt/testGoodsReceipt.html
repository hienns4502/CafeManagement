<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}"
>
<head>
    <meta charset="UTF-8">
    <title>Phiếu nhập hàng hóa</title>
</head>
<body>
<div layout:fragment="content">

    <form id="goodsReceiptForm" th:action="@{/goods-receipt/save}" th:object="${goodsReceiptDTO}" method="post">
        <!-- Các thông tin chung của phiếu nhập -->
        <div class="row">
            <div class="col-md-6">
                <label>Nhà cung cấp:</label>
                <select class="form-select"  required>
                    <option value="">-- Chọn nhà cung cấp --</option>
                    <option th:each="s : ${nhaCungCap}" th:value="${s.id}" th:text="${s.tenNhaCungCap}"></option>
                </select>
            </div>
            <!-- Ngày nhập, Người nhập... -->
        </div>

        <!-- Khu vực nhập chi tiết hàng hóa (Chỉ dùng để nhập tạm, KHÔNG đặt name trùng với entity chính để tránh bị lỗi binding thừa) -->
        <div class="card p-3 my-3">
            <div class="row">
                <div class="col-md-4">
                    <label>Hàng hóa nhập:</label>
                    <select id="tempHangHoa" class="form-control select">
                        <option value="">Chọn hàng hóa</option>
                        <option th:each="h : ${hangHoa}"
                                th:value="${h.id}"
                                th:text="${h.tenHangHoa}"
                                th:data-unit="${h.donViTinh?.tenDonViTinh}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label>Số lượng:</label>
                    <input type="number" id="tempSoLuong" class="form-control" value="1" min="1">
                </div>
                <div class="col-md-2">
                    <label>ĐVT:</label>
                    <input type="text" id="tempDvt" class="form-control" readonly>
                </div>
                <div class="col-md-2">
                    <label>Đơn giá:</label>
                    <input type="number" id="tempDonGia" class="form-control" value="0">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" id="btnAddRow" class="btn btn-primary w-100">Thêm</button>
                </div>
            </div>
        </div>

        <!-- Bảng hiển thị danh sách chi tiết -->
        <table class="table table-bordered" id="detailTable">
            <thead>
            <tr>
                <th>STT</th>
                <th>Tên hàng hóa</th>
                <th>Số lượng</th>
                <th>Đơn vị tính</th>
                <th>Đơn giá</th>
                <th>Thành tiền</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <!-- Dữ liệu sẽ được JS chèn vào đây -->
            </tbody>
        </table>

        <button type="submit" class="btn btn-success">Lưu phiếu nhập</button>
    </form>

</div>
</body>
</html>
