<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>Thêm thực đơn</title>
</head>
<body>
<div layout:fragment="content">
    <div class="mt-5 text-left">
        <form th:action="@{${action == 'add' ? '/manager/dish/process-add' : '/manager/dish/process-update'}}"
              method="post"
              th:object="${dish}"
              style="margin: 0 auto; width: 100%">
            <input type="hidden" th:field="*{id}" th:if="${action != 'add'}">
            <div class="d-flex flex-row ">
                <div class="form-group row">
                    <label class="form-col-label col-4 text-left">Tên món</label>
                    <div class="col-8">
                        <input type="text" class="form-control" th:field="*{tenMon}" required>
                    </div>
                </div>
                <div class="form-group row ml-5">
                    <label class="form-col-label col-4 text-left">Giá tiền</label>
                    <div class="col-8">
                        <input type="number" oninput="if(this.value < 0) this.value = 0" on class="form-control"
                               th:field="*{giaTien}" required>
                    </div>
                </div>
            </div>

            <span class="mb-2">Thành phần:</span>
            <div  class="overflow-auto mt-2" style="max-height: 300px;">
                <table class="table table-triped table-bordered overflow-auto" >
                    <thead class="thead-light sticky-top">
                    <th>Tên thành phần</th>
                    <th>Khối lượng</th>
                    <th>Đơn vị tính</th>
                    </thead>
                    <tbody>
                    <tr>
                        <td>Sữa tươi không đường</td>
                        <td>20</td>
                        <td>Ml</td>
                    </tr>
                    <tr>
                        <td>Sữa tươi không đường</td>
                        <td>20</td>
                        <td>Ml</td>
                    </tr>
                    <tr>
                        <td>Sữa tươi không đường</td>
                        <td>20</td>
                        <td>Ml</td>
                    </tr>
                    <tr>
                        <td>Sữa tươi không đường</td>
                        <td>20</td>
                        <td>Ml</td>
                    </tr>
                    <tr>
                        <td>Sữa tươi không đường</td>
                        <td>20</td>
                        <td>Ml</td>
                    </tr>
                    <tr>
                        <td>Sữa tươi không đường</td>
                        <td>20</td>
                        <td>Ml</td>
                    </tr>
                    <tr>
                        <td>Sữa tươi không đường</td>
                        <td>20</td>
                        <td>Ml</td>
                    </tr>
                    <tr>
                        <td>Sữa tươi không đường</td>
                        <td>20</td>
                        <td>Ml</td>
                    </tr>
                    <tr>
                        <td>Sữa tươi không đường</td>
                        <td>20</td>
                        <td>Ml</td>
                    </tr>
                    <tr>
                        <td colspan="3" class="text-center">
                            <div>
                                <button type="button" class="btn btn-primary btn-sm">
                                    <i class="fa fa-plus-circle" aria-hidden="true"></i>
                                    Thêm
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-5 text-center">
                <button type="submit" class="btn btn-primary"
                        th:text="${action == 'add' ? 'Thêm' : 'Cập nhật'}"></button>
                <a href="/manager/dish/list" class="btn btn-danger ml-5">Hủy</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
