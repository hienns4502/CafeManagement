<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>Trang cá nhân</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div layout:fragment="content">
    <div th:object="${employee}"
            class="row p-3 ">
        <div class="col-10 text-left">
            <div class="border-bottom border-1 ">
                <div class="">
                    <label>Họ và tên:</label>
                    <span th:text="*{hoTen}">Nguyễn Thanh Hải</span>
                </div>
                <div class="">
                    <label>Chức vụ:</label>
                    <span th:text="*{position.chucVu}">Waiter</span>
                </div>
                <div class="">
                    <label>Địa chỉ:</label>
                    <span th:text="*{diaChi}">123 Hàng Bông, Hai Bà Trưng, Hà Nội</span>
                </div>
                <div class="">
                    <label>Số điện thoại:</label>
                    <span th:text="*{soDienThoai}">0925556123</span>
                </div>
            </div>
            <div class="d-flex justify-content-between mt-3">
                <div class="">
                    <label>Tên đăng nhập:</label>
                    <span th:text="*{username}">nguyenthanhhai</span>
                </div>
                <div class="">
                    <label>Mật khẩu:</label>
                    <span>*********</span>
                </div>
            </div>
            <div class="d-flex justify-content-center mt-3">
                <a href="/profile-edit" class="btn btn-primary">Chỉnh sửa</a>
            </div>
        </div>
        <div class="col-2">
            <div>
                <img id="preview-avatar" th:src="@{|/uploads/*{pathAvatar}|}"
                     class="bg-white" width="120px"
                     th:attr="onerror=|this.src='@{/img/default.png}'|"
                     height="120px" style="object-fit: cover;">
            </div>
        </div>
    </div>
</div>
</body>
</html>
