<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trang chủ</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        /* ===== Mặc định (desktop): giữ nguyên layout gốc ===== */
        .mobile-topbar { display: none; }
        .sidebar-overlay { display: none; }

        /* ===== Mobile (< 768px) ===== */
        @media (max-width: 767.98px) {

            /* Ẩn tiêu đề desktop, hiện thanh top bar có nút hamburger */
            .desktop-title { display: none; }
            .mobile-topbar {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px 15px;
                border-bottom: 1px solid #dee2e6;
                background: #fff;
            }
            .mobile-topbar h1 {
                font-size: 20px;
                margin: 0;
            }
            .hamburger-btn {
                background: none;
                border: none;
                font-size: 24px;
                line-height: 1;
                padding: 0;
                cursor: pointer;
            }

            /* Sidebar biến thành drawer trượt từ trái */
            .sidebar-col {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: 260px;
                max-width: 80vw;
                z-index: 1050;
                background: #fff;
                overflow-y: auto;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                border-right: 1px solid #dee2e6;
                border-top: none !important;
            }
            .sidebar-col.show {
                transform: translateX(0);
            }

            /* Lớp phủ mờ phía sau khi mở drawer */
            .sidebar-overlay.show {
                display: block;
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,.4);
                z-index: 1040;
            }

            /* Nội dung chính chiếm full width */
            .content-col {
                flex: 0 0 100%;
                max-width: 100%;
                padding: 0 !important;
            }

            /* Giảm chiều cao khối chào mừng cho vừa màn hình nhỏ */
            .hero-box {
                height: 60vh !important;
            }
            .hero-box h1 {
                font-size: 22px;
                text-align: center;
                padding: 0 16px;
            }
        }
    </style>

</head>
<body style="overflow-y: scroll;">

<!-- Thanh top bar chỉ hiện trên mobile -->
<div class="mobile-topbar">
    <button class="hamburger-btn" type="button" id="sidebarToggleBtn">
        &#9776;
    </button>
    <h1>Trang chủ</h1>
</div>

<!-- Lớp phủ mờ khi mở sidebar trên mobile -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="container">
    <div>
        <div class="desktop-title">
            <h1>Trang chủ</h1>
        </div>
        <div class="row">
            <div class="col-3 sidebar-col" id="sidebarCol">
                <div class="border p-2 h-100">
                    <div th:insert="~{fragments/sidebar :: sidebar}"></div>
                </div>
            </div>
            <div class="col-9 content-col text-center" style="height: 90vh">
                <div class="border h-100">
                    <div class="d-flex justify-content-center align-items-center flex-column hero-box"
                         style="
                    width: 100%;
                    height: 100%;
                    background-image: linear-gradient(90deg, rgba(55, 32, 20, .92), rgba(55, 32, 20, .55), rgba(55, 32, 20, .15)), url('https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&fit=crop&w=1400&q=85');
                    background-size: cover;
                    background-position: center;
                    box-shadow: 0 10px 30px rgba(0, 0, 0, .08);">
                        <h1 class="text-white">
                            Xin chào,
                            <sp sec:authentication="principal.hoTen">Name</sp>
                            !
                        </h1>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="btn btn-danger">Logout</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Thư viện jQuery và Bootstrap 4 JS bắt buộc phải có cho tính năng Collapse -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script th:src="@{/js/index.js}"></script>

<!-- JS xử lý mở/đóng sidebar trên mobile -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var toggleBtn = document.getElementById('sidebarToggleBtn');
        var sidebar = document.getElementById('sidebarCol');
        var overlay = document.getElementById('sidebarOverlay');

        function openSidebar() {
            sidebar.classList.add('show');
            overlay.classList.add('show');
        }
        function closeSidebar() {
            sidebar.classList.remove('show');
            overlay.classList.remove('show');
        }

        toggleBtn.addEventListener('click', openSidebar);
        overlay.addEventListener('click', closeSidebar);

        // Đóng sidebar khi bấm 1 mục menu (chỉ áp dụng ở mobile)
        sidebar.addEventListener('click', function (e) {
            if (window.innerWidth < 768 && e.target.tagName === 'A') {
                closeSidebar();
            }
        });
    });
</script>

</body>
</html>
