<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>Thêm hàng hóa</title>
</head>
<body>
<div layout:fragment="content">
    <div class="mt-5">
        <form th:action="@{${action == 'add' ? '/manager/voucher/process-add' : '/manager/voucher/process-update'}}"
              method="post"
              th:object="${voucher}"
              style="margin: 0 auto; width: 100%">
            <input type="hidden" th:field="*{id}" th:if="${action != 'add'}">
            <div>
                <div class="form-group row">
                    <label class="form-col-label col-3 text-left">Tên khuyến mãi</label>
                    <div class="col-9">
                        <input type="text" class="form-control" th:field="*{tenKhuyenMai}" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="form-col-label col-3 text-left">Ngày bắt đầu</label>
                    <div class="col-9">
                        <input type="date" class="form-control"
                               th:field="*{ngayBatDau}" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="form-col-label col-3 text-left">Ngày kết thúc</label>
                    <div class="col-9">
                        <input type="date" class="form-control"
                               th:field="*{ngayKetThuc}" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="form-col-label col-3 text-left">Phần trăm giảm giá</label>
                    <div class="col-9">
                        <input type="number" min="0" oninput="if(this.value < 0) this.value = 0;" class="form-control"
                               th:field="*{phanTramGiamGia}" required>
                    </div>
                </div>

            </div>
            <div class="mt-5">
                <button type="submit" class="btn btn-primary"
                        th:text="${action == 'add' ? 'Thêm' : 'Cập nhật'}"></button>
                <a href="/manager/voucher/list" class="btn btn-danger ml-5">Hủy</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
