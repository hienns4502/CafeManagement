<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}"
>
<head>
    <meta charset="UTF-8">
    <title>Tạo phiếu nhập hàng</title>
</head>
<body>
<div layout:fragment="content">

    <form th:action="@{/manager/delivery-note/process-create}" method="post" th:object="${deliveryNoteDTO}">
        <div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="font-weight-bold mb-1">
                        <i class="fas fa-file-export text-primary mr-2"></i>
                        Tạo phiếu xuất hàng
                    </h3>

                    <p class="text-muted mb-0">
                        Tạo phiếu xuất hàng từ kho
                    </p>
                </div>

                <div>
                    <button type="button"
                            class="btn btn-secondary mr-2"
                            onclick="window.history.back()">
                        <i class="fas fa-arrow-left mr-1"></i>
                        Quay lại
                    </button>
                </div>

            </div>

            <div class="card shadow-sm mb-4">

                <div class="card-header bg-white">
                    <h5 class="mb-0 font-weight-bold">
                        <i class="fas fa-info-circle text-primary mr-2"></i>
                        Thông tin phiếu xuất
                    </h5>
                </div>

                <div class="card-body">

                    <div class="form-row">

                        <!-- Ngày xuất -->
                        <div class="form-group col-md-4">
                            <label class="font-weight-bold">
                                Ngày xuất
                            </label>

                            <input type="datetime-local"
                                   class="form-control"
                                   th:field="*{ngayXuat}"
                                   required
                            >
                        </div>

                        <div class="form-group col-md-4">

                            <label class="font-weight-bold">
                                Người xuất
                            </label>

                            <select class="form-control select" th:field="*{nguoiXuat.id}"
                                    data-placeholder="Chọn người xuất" required>
                                <option value="">-- Chọn người xuất --</option>
                                <option th:each="e : ${employees}" th:value="${e.id}"
                                        th:text="${e.hoTen}"
                                ></option>
                            </select>

                        </div>

                        <div class="form-group col-md-4">

                            <label class="font-weight-bold">
                                Người nhận
                            </label>

                            <select class="form-control select" th:field="*{nguoiNhan.id}" required
                                    data-placeholder="Chọn người nhận">
                                <option value="">-- Chọn người nhận --</option>
                                <option th:each="e : ${employees}" th:value="${e.id}"
                                        th:text="${e.hoTen}"
                                ></option>
                            </select>

                        </div>

                    </div>

                    <div class="form-group mb-0">

                        <label class="font-weight-bold">
                            Lý do xuất
                        </label>

                        <textarea class="form-control"
                                  rows="3"
                                  th:field="*{lyDo}"
                                  placeholder="Nhập lý do xuất hàng..." required></textarea>

                    </div>

                </div>
            </div>

            <div class="card shadow-sm mb-4">

                <div class="card-header bg-white">

                <span class="mb-0 font-weight-bold">
                    <i class="fas fa-box-open text-primary mr-2"></i>
                    Thêm hàng hóa xuất kho
                </span>

                </div>

                <div class="card-body">

                    <div class="form-row align-items-end">

                        <!-- Hàng hóa -->
                        <div class="form-group col-md-9 mb-0">

                            <label class="font-weight-bold">
                                Hàng hóa
                            </label>

                            <select id="tempMerchandise" class="form-control select"
                                    data-placeholder="Chọn hàng hóa cần xuất">
                                <option value="">-- Chọn hàng hóa --</option>
                                <option th:each="m : ${merchandises}" th:value="${m.id}"
                                        th:text="${m.tenHangHoa}" th:data-unit="${m.donViTinh.tenDonViTinh}"
                                        th:data-stock="${m.soLuong}" th:data-price="${m.donGia}"
                                ></option>
                            </select>

                        </div>


                        <!-- Số lượng -->
                        <div class="form-group col-md-2 mb-0">

                            <label class="font-weight-bold">
                                Số lượng
                            </label>

                            <input type="number"
                                   id="tempSoLuong"
                                   class="form-control"
                                   min="1"
                                   value="1">
                        </div>

                        <div class="form-group col-md-1 mb-0">
                            <button id="btnAddRow" type="button" class="btn btn-primary">Thêm
                            </button>
                        </div>

                    </div>

                </div>
            </div>

            <div class="card shadow-sm">

                <div class="card-header bg-white d-flex justify-content-between align-items-center">

                    <h5 class="mb-0 font-weight-bold">

                        <i class="fas fa-list text-primary mr-2"></i>

                        Danh sách hàng hóa xuất

                    </h5>
                </div>


                <div class="card-body p-0">

                    <div class="table-responsive">

                        <table id="detailTable" class="table table-bordered table-hover mb-0">

                            <thead class="thead-light">

                            <tr class="text-center">

                                <th style="">
                                    STT
                                </th>

                                <th>
                                    Hàng hóa
                                </th>

                                <th>
                                    Đơn vị
                                </th>

                                <th>
                                    Tồn kho
                                </th>

                                <th>
                                    Số lượng
                                </th>

                                <th>
                                    Đơn giá
                                </th>

                                <th>
                                    Thành tiền
                                </th>

                                <th>
                                    Thao tác
                                </th>

                            </tr>

                            </thead>


                            <tbody>

                            </tbody>

                        </table>

                    </div>

                </div>


                <div class="card-footer bg-white d-flex justify-content-end">

                    <div class="col-md-4 text-md-right">
                        <div class="text-muted">
                            Tổng giá trị
                        </div>

                        <h4 th:field="*{tongTien}" class="font-weight-bold text-primary" id="showTotal">

                        </h4>
                    </div>

                </div>

            </div>


            <div class="text-right mt-4">

                <button type="button"
                        class="btn btn-secondary mr-2 mb-4"
                        onclick="window.history.back()">

                    <i class="fas fa-times mr-1"></i>
                    Hủy

                </button>


                <button type="submit"
                        class="btn btn-primary mb-4">

                    <i class="fas fa-save mr-1"></i>
                    Lưu phiếu xuất

                </button>

            </div>

        </div>
    </form>

</div>
<th:block layout:fragment="script">
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/deliveryNote.js}"></script>
</th:block>
</body>
</html>
