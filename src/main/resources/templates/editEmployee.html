<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa nhân viên</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div class="container text-center">
    <div>
        <h1>Chỉnh sửa nhân viên</h1>
    </div>
    <div class="row mt-3">

        <form th:action="@{process_edit}" method="post"
              th:object="${employee}"
              style="margin: 0 auto; width: 100%"
              enctype="multipart/form-data"
        >
            <div class="row">
                <div class="col-10">
                    <input type="hidden" th:field="*{id}">
                    <div>
                        <div class="form-group row">
                            <label class="form-col-label col-3 text-left">Họ và tên</label>
                            <div class="col-9">
                                <input type="text" class="form-control" th:field="*{hoTen}" required>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="form-col-label col-3 text-left">Địa chỉ</label>
                            <div class="col-9">
                                <input type="text" class="form-control" th:field="*{diaChi}" required>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="form-col-label col-3 text-left">Số điện thoại</label>
                            <div class="col-9">
                                <input type="text" class="form-control" th:field="*{soDienThoai}" required>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="form-col-label col-3 text-left">Tên đăng nhập</label>
                            <div class="col-9">
                                <input type="text" class="form-control" th:field="*{username}" required minlength="4">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="form-col-label col-3 text-left">Chức vụ</label>
                            <div class="col-9 text-left">
                                <select class="form-select" name="positionId">
                                    <option value="" disabled selected>Chức vụ</option>
                                    <option
                                            th:each="p : ${positions}"
                                            th:value="${p.id}"
                                            th:text="${p.chucVu}"
                                            th:selected="${employee.position != null and p.id == employee.position.id}"
                                    >
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary mr-4">Cập nhật</button>
                        <a th:href="@{/employees}" class="btn btn-danger">Hủy</a>
                    </div>
                </div>
                <div class="col-2">
                    <div>
                        <img id="preview-avatar" th:src="@{|/uploads/*{pathAvatar}|}"
                             class="bg-white" width="120px"
                             th:attr="onerror=|this.src='@{/img/default.png}'|"
                             height="auto" style="object-fit: cover;">
                    </div>
                    <div>
                        <input type="file" id="form-file" class="d-none" name="avatarFile" accept="image/*">
                        <label for="form-file" class="btn-sm btn-secondary mt-3">Thay đổi...</label>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<script th:src="@{/js/preview.js}"></script>
</body>
</html>
